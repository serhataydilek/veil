android.useAndroidX=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process

# Consumed FFI build inputs only. Keep aligned with ADR 014.
# UniFFI 0.32.0 lives in rust/ Cargo.toml files.
# JNA 5.19.1 and NDK 29.0.14206865 live in android/gradle/libs.versions.toml.
# Rust 1.88.0 is owned by rust/rust-toolchain.toml; veil.rustVersion must match it.
veil.cargoNdkVersion=4.1.2
veil.nativeApiLevel=26
veil.rustVersion=1.88.0
