[package]
name = "veil-uniffi-bindgen"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Workspace-local UniFFI bindgen pinned to the same UniFFI version as veil-ffi."

[[bin]]
name = "veil-uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { version = "=0.32.0", default-features = false, features = ["cli"] }
